name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']
        # Laravel 11 is intentionally excluded from CI: the entire 11.x line is
        # currently flagged by unpatched security advisories, so resolving it
        # would require bypassing Composer's advisory protection. The package
        # still declares Laravel 11 support in composer.json.
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Resolve Laravel matrix dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-progress --no-update
          composer update --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
